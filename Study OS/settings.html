<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-theme="light">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">S</div><span class="sidebar-brand">StudyOS</span></div>
    <nav><ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📊</span> Dashboard</a></li>
      <li class="sidebar-nav-item"><a href="settings.html" class="sidebar-nav-link active"><span class="sidebar-nav-icon">⚙️</span> Settings</a></li>
    </ul></nav>
  </aside>

  <nav class="navbar">
    <h2 class="navbar-brand">Settings</h2>
    <div class="navbar-actions">
      <button class="btn btn-icon" data-theme-btn="light">☀️</button>
      <button class="btn btn-icon" data-theme-btn="dark">🌙</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h3>Theme Preferences</h3>
      <div style="display: flex; gap: var(--spacing-lg); align-items: center;">
        <button class="btn btn-primary" data-theme-btn="light">☀️ Light Mode</button>
        <button class="btn btn-secondary" data-theme-btn="dark">🌙 Dark Mode</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h3>Study Preferences</h3>
      <div class="form-group">
        <label for="daily-target">Daily Study Target (minutes)</label>
        <input type="number" id="daily-target" value="240" min="30" max="720">
        <button class="btn btn-sm btn-primary" style="margin-top: var(--spacing-md);" onclick="saveDailyTarget()">Save</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h3>Data Management</h3>
      <div style="display: grid; gap: var(--spacing-md);">
        <button class="btn btn-secondary" onclick="downloadData();">📥 Export Data</button>
        <button class="btn btn-secondary" onclick="importDataDialog();">📤 Import Data</button>
        <input type="file" id="import-file" accept=".json" style="display: none;">
        <button class="btn btn-outline btn-danger" onclick="confirmClear();" style="border-color: var(--accent-red); color: var(--accent-red);">🗑️ Clear All Data</button>
      </div>
    </div>

    <div class="card">
      <h3>Statistics</h3>
      <div id="storage-stats" style="display: grid; gap: var(--spacing-md);"></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      displayStats();
      document.getElementById('daily-target').value = storage.getUserPreferences().dailyTarget || 240;
    });

    function saveDailyTarget() {
      const target = parseInt(document.getElementById('daily-target').value);
      storage.updateUserPreference('dailyTarget', target);
      notifier.success('Daily target updated!');
    }

    function downloadData() {
      storage.downloadDataAsFile();
      notifier.success('Data exported!');
    }

    function importDataDialog() {
      const input = document.getElementById('import-file');
      input.click();
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          if (storage.importData(event.target.result)) {
            notifier.success('Data imported!');
            location.reload();
          } else {
            notifier.error('Failed to import data');
          }
        };
        reader.readAsText(file);
      });
    }

    function confirmClear() {
      app.confirm('Are you sure? This will delete all your data!', () => {
        storage.clear();
        notifier.success('All data cleared');
        location.reload();
      });
    }

    function displayStats() {
      const stats = storage.getStorageStats();
      document.getElementById('storage-stats').innerHTML = `
        <p><strong>Total Items:</strong> ${stats.itemCount}</p>
        <p><strong>Storage Used:</strong> ${stats.totalSizeKB} KB</p>
        <p><strong>Storage Remaining:</strong> ${stats.limits.remaining.toFixed(2)} KB</p>
      `;
    }
  </script>
</body>
</html>
