<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-theme="light">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">S</div><span class="sidebar-brand">StudyOS</span></div>
    <nav><ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📊</span> Dashboard</a></li>
      <li class="sidebar-nav-item"><a href="calendar.html" class="sidebar-nav-link active"><span class="sidebar-nav-icon">🗓️</span> Calendar</a></li>
    </ul></nav>
  </aside>

  <nav class="navbar">
    <h2 class="navbar-brand">Calendar & Schedule</h2>
    <div class="navbar-actions">
      <button class="btn btn-icon" data-theme-btn="light">☀️</button>
      <button class="btn btn-icon" data-theme-btn="dark">🌙</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="grid-2">
      <div class="card">
        <h3>Add Event</h3>
        <form id="event-form" style="display: grid; gap: var(--spacing-lg);">
          <div class="form-group">
            <label for="event-title">Event Title</label>
            <input type="text" id="event-title" required>
          </div>
          <div class="form-group">
            <label for="event-date">Date</label>
            <input type="date" id="event-date" required>
          </div>
          <div class="form-group">
            <label for="event-time">Time</label>
            <input type="time" id="event-time">
          </div>
          <button type="submit" class="btn btn-primary">Add Event</button>
        </form>
      </div>

      <div class="card">
        <h3>Upcoming Events</h3>
        <div id="events-list" style="display: grid; gap: var(--spacing-md);">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('event-form').addEventListener('submit', (e) => {
        e.preventDefault();
        storage.addCalendarEvent({
          title: document.getElementById('event-title').value,
          date: document.getElementById('event-date').value,
          time: document.getElementById('event-time').value
        });
        notifier.success('Event added!');
        document.getElementById('event-form').reset();
        displayEvents();
      });
      displayEvents();
    });

    function displayEvents() {
      const events = storage.getCalendarEvents().sort((a, b) => new Date(a.date) - new Date(b.date));
      const container = document.getElementById('events-list');
      if (events.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No events scheduled</p>';
        return;
      }
      container.innerHTML = events.map(e => `
        <div style="padding: var(--spacing-md); background: var(--bg-secondary); border-radius: var(--radius-lg);">
          <strong>${e.title}</strong>
          <p style="margin: var(--spacing-sm) 0; color: var(--text-secondary); font-size: 0.9rem;">${app.formatDate(e.date)} ${e.time ? 'at ' + e.time : ''}</p>
          <button class="btn btn-sm btn-outline" onclick="storage.deleteCalendarEvent(${e.id}); displayEvents();">Delete</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
