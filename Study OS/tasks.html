<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/tasks.css">
</head>
<body data-theme="light">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">S</div>
      <span class="sidebar-brand">StudyOS</span>
    </div>
    <nav>
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item"><a href="dashboard.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📊</span> Dashboard</a></li>
        <li class="sidebar-nav-item"><a href="planner.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📅</span> Study Planner</a></li>
        <li class="sidebar-nav-item"><a href="tasks.html" class="sidebar-nav-link active"><span class="sidebar-nav-icon">✓</span> Tasks</a></li>
        <li class="sidebar-nav-item"><a href="goals.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">🎯</span> Goals</a></li>
        <li class="sidebar-nav-item"><a href="pomodoro.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">🍅</span> Pomodoro</a></li>
        <li class="sidebar-nav-item"><a href="notes.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📝</span> Notes</a></li>
        <li class="sidebar-nav-item"><a href="analytics.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📈</span> Analytics</a></li>
        <li class="sidebar-nav-item"><a href="calendar.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">🗓️</span> Calendar</a></li>
        <li class="sidebar-nav-item"><a href="settings.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">⚙️</span> Settings</a></li>
        <li class="sidebar-nav-item"><a href="about.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">ℹ️</span> About</a></li>
      </ul>
    </nav>
  </aside>

  <nav class="navbar">
    <h2 class="navbar-brand" id="page-title">Task Manager</h2>
    <div class="navbar-actions">
      <button class="btn btn-icon" data-theme-btn="light">☀️</button>
      <button class="btn btn-icon" data-theme-btn="dark">🌙</button>
      <div class="dropdown">
        <button class="dropdown-trigger">👤</button>
        <div class="dropdown-menu">
          <a href="settings.html" class="dropdown-item">Settings</a>
          <div class="dropdown-divider"></div>
          <a href="index.html" class="dropdown-item">Back to Home</a>
        </div>
      </div>
    </div>
  </navbar>

  <main class="main-content">
    <div class="breadcrumb">
      <span class="breadcrumb-item active">Task Manager</span>
    </div>

    <!-- ADD TASK SECTION -->
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h3 style="margin-bottom: var(--spacing-lg);">Create New Task</h3>
      <form id="add-task-form" style="display: grid; gap: var(--spacing-lg);">
        <div class="grid-2">
          <div class="form-group">
            <label for="task-title">Task Title *</label>
            <input type="text" id="task-title" name="title" required placeholder="Enter task title">
          </div>
          <div class="form-group">
            <label for="task-category">Category</label>
            <select id="task-category" name="category">
              <option>Select a category</option>
              <option>Math</option>
              <option>Science</option>
              <option>English</option>
              <option>History</option>
              <option>Project</option>
              <option>Assignment</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
              <option value="urgent">⚡ Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="dueDate">
          </div>
        </div>

        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" placeholder="Add task details..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </div>

    <!-- FILTERS & SEARCH -->
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <div class="flex-between">
        <div style="flex: 1;">
          <input type="text" id="search-tasks" placeholder="🔍 Search tasks..." style="margin-bottom: 0;">
        </div>
        <div style="display: flex; gap: var(--spacing-md); margin-left: var(--spacing-lg);">
          <select id="filter-category" style="width: 150px;">
            <option value="">All Categories</option>
          </select>
          <select id="filter-priority" style="width: 150px;">
            <option value="">All Priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
          <select id="filter-status" style="width: 150px;">
            <option value="">All Tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TASKS LIST -->
    <div class="section">
      <h3 class="section-title">Your Tasks</h3>
      <div id="tasks-list" style="display: grid; gap: var(--spacing-md);">
        <!-- Populated by JS -->
      </div>
    </div>
  </main>

  <!-- EDIT TASK MODAL -->
  <div class="modal-backdrop" id="edit-task-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit Task</h3>
        <button class="modal-close">×</button>
      </div>
      <form id="edit-task-form" style="display: grid; gap: var(--spacing-lg);">
        <div class="form-group">
          <label for="edit-task-title">Task Title *</label>
          <input type="text" id="edit-task-title" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="edit-task-priority">Priority</label>
            <select id="edit-task-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-task-due-date">Due Date</label>
            <input type="date" id="edit-task-due-date">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="app.closeModal('#edit-task-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/productivity-score.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
