<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals - StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-theme="light">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">S</div><span class="sidebar-brand">StudyOS</span></div>
    <nav><ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="dashboard.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📊</span> Dashboard</a></li>
      <li class="sidebar-nav-item"><a href="planner.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📅</span> Planner</a></li>
      <li class="sidebar-nav-item"><a href="tasks.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">✓</span> Tasks</a></li>
      <li class="sidebar-nav-item"><a href="goals.html" class="sidebar-nav-link active"><span class="sidebar-nav-icon">🎯</span> Goals</a></li>
      <li class="sidebar-nav-item"><a href="pomodoro.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">🍅</span> Pomodoro</a></li>
      <li class="sidebar-nav-item"><a href="notes.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📝</span> Notes</a></li>
      <li class="sidebar-nav-item"><a href="analytics.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📈</span> Analytics</a></li>
      <li class="sidebar-nav-item"><a href="calendar.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">🗓️</span> Calendar</a></li>
      <li class="sidebar-nav-item"><a href="settings.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">⚙️</span> Settings</a></li>
    </ul></nav>
  </aside>

  <nav class="navbar">
    <h2 class="navbar-brand">Goal Tracker</h2>
    <div class="navbar-actions">
      <button class="btn btn-icon" data-theme-btn="light">☀️</button>
      <button class="btn btn-icon" data-theme-btn="dark">🌙</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h3>Create Goal</h3>
      <form id="goal-form" style="display: grid; gap: var(--spacing-lg);">
        <div class="form-group">
          <label for="goal-title">Goal Title *</label>
          <input type="text" id="goal-title" required placeholder="E.g., JEE Mains Score 95%">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="goal-type">Type</label>
            <select id="goal-type">
              <option value="academic">Academic</option>
              <option value="skill">Skill</option>
              <option value="placement">Placement</option>
              <option value="certification">Certification</option>
            </select>
          </div>
          <div class="form-group">
            <label for="goal-deadline">Deadline</label>
            <input type="date" id="goal-deadline">
          </div>
        </div>
        <div class="form-group">
          <label for="goal-description">Description</label>
          <textarea id="goal-description" placeholder="What do you want to achieve?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Goal</button>
      </form>
    </div>

    <h3 style="margin-bottom: var(--spacing-lg);">Your Goals</h3>
    <div id="goals-list" style="display: grid; gap: var(--spacing-md);">
      <div class="empty-state"><div class="empty-state-icon">🎯</div><p>No goals yet. Create one to get started!</p></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/productivity-score.js"></script>
  <script src="js/achievements.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('goal-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const goal = storage.addGoal({
          title: document.getElementById('goal-title').value,
          type: document.getElementById('goal-type').value,
          deadline: document.getElementById('goal-deadline').value,
          description: document.getElementById('goal-description').value
        });
        notifier.success('Goal created!');
        document.getElementById('goal-form').reset();
        displayGoals();
        achievements.checkAndUnlock('goal_setter');
      });
      displayGoals();
    });

    function displayGoals() {
      const goals = storage.getGoals();
      const container = document.getElementById('goals-list');
      if (goals.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎯</div><p>No goals yet</p></div>';
        return;
      }
      container.innerHTML = goals.map(goal => `
        <div class="card">
          <div class="flex-between">
            <div>
              <h4>${goal.title}</h4>
              <p style="color: var(--text-secondary);">${goal.type} ${goal.deadline ? '• Due ' + app.formatDate(goal.deadline) : ''}</p>
            </div>
            <button class="btn btn-sm btn-icon" onclick="storage.deleteGoal(${goal.id}); displayGoals();">🗑️</button>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" style="width: ${goal.progress || 0}%;">${goal.progress || 0}%</div>
          </div>
          <input type="range" min="0" max="100" value="${goal.progress || 0}" onchange="storage.updateGoal(${goal.id}, {progress: this.value}); displayGoals();" style="width: 100%; margin-top: var(--spacing-md);">
        </div>
      `).join('');
    }
  </script>
</body>
</html>
